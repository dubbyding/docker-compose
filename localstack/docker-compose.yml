version: "3.8"

services:
  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559" # external services port range
    environment:
      - DEBUG=${DEBUG:-0}
      - LOCALSTACK_AUTH_TOKEN=LOCALSTACK_AUTH_TOKEN
      - SERVICES=${SERVICES:-s3}        # ensure s3 is enabled; add other services as needed
      - DATA_DIR=/var/lib/localstack
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # Provide bucket names as comma separated list, e.g. BUCKETS="public-bucket,site-bucket"
      - BUCKETS=${BUCKETS:-local-public-bucket,local-site-bucket}
      # set to "1" to upload a tiny sample index.html to each bucket
      - UPLOAD_SAMPLE=${UPLOAD_SAMPLE:-1}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

networks:
  default:
    name: localstack-net
